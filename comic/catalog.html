<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="Comic 素材:所有背景與配件。">
  <title>Comic 素材</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E💬%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <span class="brand">Comic</span>
    <span class="spacer"></span>
    <span class="btn" aria-current="page" style="background:var(--bg-code)">素材</span>
    <a class="btn" href="index.html">編輯器</a>
  </header>
  <main class="catalog">
    <p class="hint">素材都是點陣圖。<b>配件</b>依<b>角色/種類</b>分組(同角色一個資料夾,變化=各姿勢),已去背週圍透明;故事用 <code>items[].item = "角色/變化"</code>(如 <code>penguin/sleepy</code>)引用。<b>背景</b>不透明鋪滿整格,用 <code>bg</code> 選。<b>多個人的故事請用不同角色</b>,別用同一角色扮兩人。定義見 <code>items.md</code>、<code>backgrounds.md</code>。</p>

    <h2 class="sec">配件 <span class="sec-note">依角色/種類分組</span></h2>
    <div id="item-sections"></div>

    <h2 class="sec">背景 <span class="sec-note">不透明,鋪滿整格</span></h2>
    <div id="bg-grid" class="grid"></div>
  </main>
  <script type="module" src="js/catalog.js"></script>
</body>
</html>
