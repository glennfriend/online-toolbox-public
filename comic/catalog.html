<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="Comic 素材:所有背景與配件。">
  <title>Comic 素材</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E💬%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <span class="brand">Comic</span>
    <span class="spacer"></span>
    <span class="btn" aria-current="page" style="background:var(--bg-code)">素材</span>
    <a class="btn" href="index.html">編輯器</a>
  </header>
  <main class="catalog">
    <p class="hint">素材都是點陣圖。<b>配件</b>依<b>畫風(style)</b>分層(同一 id 在不同畫風是不同圖,畫風不混),已去背(週圍透明)。<b>背景</b>不透明、鋪滿整格、所有畫風共用。故事用 <code>style</code> 選畫風、<code>items[].item</code> 選配件、<code>bg</code> 選背景。定義見 <code>items.md</code>、<code>backgrounds.md</code>。</p>

    <h2 class="sec">配件 <span class="sec-note">依畫風分層,去背週圍透明</span></h2>
    <div id="item-sections"></div>

    <h2 class="sec">背景 <span class="sec-note">不透明,鋪滿整格,共用</span></h2>
    <div id="bg-grid" class="grid"></div>
  </main>
  <script type="module" src="js/catalog.js"></script>
</body>
</html>
