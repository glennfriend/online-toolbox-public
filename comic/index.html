<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="JSON 劇本 → 向量漫畫。畫風由固定 SVG 資產庫保證,永遠一致。">
  <title>Comic</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E💬%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <span class="brand">Comic
      <span class="info"><span class="info-btn" tabindex="0" aria-label="說明">💡</span>
        <span class="info-tip">
          <span class="tip-h">[Feature]</span>
          <span>JSON 劇本 → SVG 漫畫(劇本與渲染分離)</span>
          <span>畫風由固定向量資產庫保證,100% 一致</span>
          <span>下載 SVG / PNG(2x)</span>
          <span class="tip-h">[Phase 1 範圍]</span>
          <span>1 角色 × 2 表情、單格、speech 氣泡</span>
          <span>版型/背景/效果/更多角色 → 畫風定稿後擴充</span>
          <span class="tip-h">[技術支援]</span>
          <span>純前端零依賴,無 CDN、無 API key</span>
        </span>
      </span>
    </span>
    <span class="spacer"></span>
    <a class="btn" href="catalog.html">角色型錄</a>
    <a class="btn" href="props.html">道具型錄</a>
    <button id="example" class="btn" type="button">範例</button>
    <button id="dl-svg" class="btn" type="button">下載 SVG</button>
    <button id="dl-png" class="btn" type="button">下載 PNG</button>
  </header>

  <main class="workspace">
    <section class="pane">
      <div class="pane-head">JSON 劇本</div>
      <textarea id="input" spellcheck="false"></textarea>
    </section>
    <section class="pane">
      <div class="pane-head">預覽</div>
      <pre id="warnings" class="warnings" hidden></pre>
      <div id="preview" class="preview"></div>
    </section>
  </main>

  <script type="module" src="js/main.js"></script>
</body>
</html>
