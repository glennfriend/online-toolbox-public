<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="JSON 劇本 → 漫畫。背景 + 去背配件 + 白底黑字對話框,點陣素材組合。">
  <title>Comic</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E💬%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <span class="brand">Comic
      <span class="info"><span class="info-btn" tabindex="0" aria-label="說明">💡</span>
        <span class="info-tip">
          <span class="tip-h">[怎麼用]</span>
          <span>左邊貼 JSON 劇本 → 右邊即時出圖(像 calcpad)</span>
          <span>「劇本」下拉 = 版本控管裡存好的漫畫</span>
          <span>小改即時編進網址,可「複製連結」分享/重現</span>
          <span>下載 SVG / PNG(2x)</span>
          <span class="tip-h">[素材]</span>
          <span>背景(不透明整格)+ 配件(去背疊上去)</span>
          <span>對話 = 白底黑字方框,直接放空白處</span>
          <span>「素材」看所有背景與配件</span>
          <span class="tip-h">[技術支援]</span>
          <span>純前端零依賴,無 CDN、無 API key</span>
        </span>
      </span>
    </span>
    <span class="spacer"></span>
    <a class="btn" href="catalog.html" title="所有背景與配件素材">素材</a>
    <select id="scripts" class="btn" title="載入版本控管裡存好的劇本"><option value="">劇本</option></select>
    <button id="copy-link" class="btn" type="button">複製連結</button>
    <select id="download" class="btn" title="下載">
      <option value="">Download</option>
      <option value="svg">SVG</option>
      <option value="png">PNG</option>
    </select>
  </header>

  <main class="workspace">
    <section class="pane">
      <div class="pane-head">JSON 劇本</div>
      <textarea id="input" spellcheck="false"></textarea>
    </section>
    <section class="pane">
      <div class="pane-head">預覽</div>
      <pre id="warnings" class="warnings" hidden></pre>
      <div id="preview" class="preview"></div>
    </section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
