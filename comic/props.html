<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="Comic 道具型錄:所有可用道具與尺寸。">
  <title>Comic 道具型錄</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E💬%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <span class="brand">Comic 道具型錄</span>
    <span class="spacer"></span>
    <a class="btn" href="catalog.html">角色型錄</a>
    <a class="btn" href="index.html">回編輯器</a>
  </header>
  <main class="catalog">
    <p class="hint">JSON 劇本中以 <code>"props":[{"prop":"pot","pos":{"x":0.3,"y":0.7},"scale":1}]</code> 擺放。pos 為格內比例(0~1,道具中心)。</p>
    <div id="grid" class="grid"></div>
  </main>
  <script type="module">
    import { PROPS } from './js/props.js';
    const grid = document.getElementById('grid');
    for (const [name, p] of Object.entries(PROPS)) {
      const cell = document.createElement('figure');
      cell.className = 'cell';
      cell.innerHTML = `<svg viewBox="0 0 ${p.w} ${p.h}" width="${Math.min(p.w, 200)}" height="${Math.min(p.h, 200) * p.h / p.w > 200 ? 200 : p.h * Math.min(p.w, 200) / p.w}" style="background:#fff">${p.svg}</svg>
        <figcaption><b>${name}</b> · ${p.w}×${p.h}</figcaption>`;
      grid.appendChild(cell);
    }
  </script>
</body>
</html>
