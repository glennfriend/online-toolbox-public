<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Curvelab</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E📈%3C/text%3E%3C/svg%3E">
<style>
  :root{
    --bg:#F2F4F7; --surface:#FFFFFF; --ink:#1B2433; --muted:#5C6675;
    --line:rgba(20,30,50,0.10); --line-strong:rgba(20,30,50,0.20);
    --accent:#0F8A66; --accent-soft:#E1F3EC;
    --x:#2F7FD0; --y:#CC5A2E;
    --danger:#C0392B;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
    --radius:12px;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#0F131A; --surface:#161B24; --ink:#E7EAF0; --muted:#9AA4B3;
      --line:rgba(255,255,255,0.10); --line-strong:rgba(255,255,255,0.20);
      --accent:#2FB488; --accent-soft:rgba(47,180,136,0.14);
      --x:#5AA0E6; --y:#E2814F; --danger:#E2675A;
    }
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--ink); font-family:var(--sans);
    font-size:16px; line-height:1.6; -webkit-font-smoothing:antialiased;
  }
  /* 左中右三欄:左=標題、中=圖、右=切換鈕 */
  .app{
    display:flex; flex-direction:row; align-items:flex-start; gap:16px;
    min-height:100vh; max-width:1060px; margin:0 auto; padding:12px 16px 0;
  }
  .app__head{ flex:0 0 92px; position:sticky; top:14px; padding:4px 0; }
  .app__head h1{ font-size:18px; font-weight:600; margin:0; letter-spacing:.01em; }
  /* 離線沒就緒的警告:預設不存在,只有真的沒收齊快取時才由 JS 插入(見頁尾載入器) */
  .offline-note{
    margin-top:6px; padding:6px 9px; border-radius:8px; cursor:pointer;
    font-size:11.5px; line-height:1.5; color:var(--danger);
    background:rgba(192,57,43,.08); border:1px solid rgba(192,57,43,.28);
  }

  .stage{
    flex:1; min-width:0; padding:0 0 24px;
  }
  .panel{
    background:var(--surface); border:1px solid var(--line);
    border-radius:var(--radius); padding:18px 18px 20px;
  }
  .eq{
    font-family:var(--mono); font-size:22px; font-weight:500;
    text-align:center; margin:2px 0 4px;
  }
  .eq .p{ color:var(--accent); }
  .readout{
    font-family:var(--mono); font-size:14px; text-align:center;
    color:var(--muted); min-height:20px; margin-bottom:12px;
  }
  .plot-wrap{ max-width:440px; margin:0 auto; }
  .plot-wrap svg{ display:block; width:100%; height:auto; }
  .plot-wrap.grab svg{ cursor:grab; touch-action:none; }

  .controls{ max-width:460px; margin:18px auto 0; display:flex; flex-direction:column; gap:12px; }
  .ctl-row{ display:flex; align-items:center; gap:12px; }
  .ctl-row label{ font-family:var(--mono); font-size:14px; color:var(--muted); }
  .ctl-row .val{ min-width:42px; text-align:right; font-size:14px; font-weight:600; }
  input[type=range]{ flex:1; accent-color:var(--accent); }
  input[type=text]{
    flex:1; font-family:var(--mono); font-size:15px; padding:9px 11px;
    border:1px solid var(--line-strong); border-radius:8px;
    background:var(--bg); color:var(--ink);
  }
  input[type=text]:focus{ outline:2px solid var(--accent); outline-offset:0; border-color:transparent; }

  .btn{
    font-family:var(--sans); font-size:14px; padding:8px 15px;
    border:1px solid var(--line-strong); border-radius:8px;
    background:transparent; color:var(--ink); cursor:pointer; white-space:nowrap;
  }
  .btn:hover{ background:var(--accent-soft); }
  .btn:active{ transform:scale(.98); }
  .presets{ display:flex; flex-wrap:wrap; gap:8px; }
  .presets .btn{ font-family:var(--mono); font-size:13px; padding:6px 11px; }

  .note{
    margin-top:18px; background:var(--bg); border-radius:var(--radius);
    padding:14px 16px; font-size:15px; line-height:1.8;
  }
  .note .x{ color:var(--x); font-weight:600; }
  .note .y{ color:var(--y); font-weight:600; }
  .note .k{ font-family:var(--mono); color:var(--accent); font-weight:600; }
  .note .accent{ color:var(--accent); font-weight:600; }
  .err{ color:var(--danger); }

  .tabs{
    flex:0 0 auto; position:sticky; top:14px;
    max-height:calc(100vh - 24px); overflow-y:auto;
    display:flex; gap:10px; padding:2px;
  }
  .tab-col{ display:flex; flex-direction:column; gap:8px; width:126px; }
  .tab-col-h{ font-size:11px; font-weight:700; color:var(--muted); letter-spacing:.03em; padding:2px 4px 0; }
  .tab{
    width:100%; text-align:center;
    padding:10px 12px; border:1px solid var(--line-strong); border-radius:10px;
    background:var(--surface); color:var(--ink); cursor:pointer;
    font-family:var(--sans); font-size:14px; line-height:1.3;
  }
  .tab small{ display:block; font-family:var(--mono); font-size:11px; color:var(--muted); margin-top:2px; }
  .tab:hover{ border-color:var(--accent); }
  .tab.active{ border:2px solid var(--accent); background:var(--accent-soft); }
  .tab.active small{ color:var(--accent); }

  /* 窄螢幕(手機):三欄改上下堆疊;切換鈕落到圖形下方、改 2 欄網格(不然 19 顆全寬堆疊要捲很久) */
  @media (max-width:760px){
    .app{ flex-direction:column; padding:8px 10px 0; }
    .app__head{ flex:none; position:static; padding:2px 0; }
    .stage{ width:100%; }
    .panel{ padding:14px 12px 16px; }
    /* 控制列:允許換行 + 滑桿可收縮(系統字級放大時,不換行會把整行撐出螢幕) */
    .ctl-row{ flex-wrap:wrap; }
    input[type=range]{ min-width:140px; }
    .tabs{ position:static; max-height:none; overflow:visible; width:100%; flex-direction:column; gap:6px; padding:0 0 18px; }
    .tab-col{ display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:8px; width:100%; }
    .tab-col-h{ grid-column:1 / -1; }
  }

  /* 💡 說明氣泡 */
  .info { position: relative; display: inline-block; font-size: 1rem; font-weight: 400; vertical-align: middle; }
  .info-btn { color: var(--muted, #57606a); cursor: help; }
  .info-btn:hover { color: var(--accent, #2563eb); }
  .info-tip { display: none; position: absolute; left: 0; top: calc(100% + 6px); z-index: 30; width: max-content; max-width: 90vw; background: #fff; color: var(--fg, #24292f); border: 1px solid var(--border, #d0d7de); border-radius: 10px; box-shadow: 0 6px 20px rgba(0,0,0,.12); padding: .6rem .8rem; font-size: .82rem; line-height: 1.6; text-align: left; }
  .info:hover .info-tip, .info-btn:focus + .info-tip { display: block; }
  .info-tip > span { display: block; margin: .15rem 0 .15rem .8rem; color: var(--muted, #57606a); }
  .info-tip > .tip-h { margin: .55rem 0 .15rem; color: var(--fg, #24292f); font-weight: 700; }
  .info-tip > .tip-h:first-child { margin-top: 0; }
</style>
</head>
<body>
<div class="app">
  <header class="app__head">
    <h1>Curvelab<span class="info"><span class="info-btn" tabindex="0" aria-label="說明">💡</span>
        <span class="info-tip">
          <span class="tip-h">[Feature]</span>
          <span>19 種互動數學曲線 / 函數視覺化</span>
          <span>滑桿即時調參、動畫播放、拖曳點</span>
          <span>自由輸入公式找根、聯立解步驟</span>
          <span class="tip-h">[不支援]</span>
          <span>儲存 / 匯出 / 分享(皆無)</span>
          <span>3D / WebGL;公式僅單變數 x</span>
          <span class="tip-h">[技術支援]</span>
          <span>SVG + requestAnimationFrame</span>
          <span>Pointer Events、自寫運算式解析</span>
          <span>純前端零依賴</span>
        </span>
      </span></h1>
  </header>
  <main class="stage" id="stage"></main>
  <nav class="tabs" id="tabs" aria-label="選擇公式"></nav>
</div>

<!-- 載入器:依序載入共用 library 與各圖模組。
     網址刻意「不加」查詢字串 —— 快取更新交給 sw.js 的 VERSION,
     以前用 ?v=Date.now() 的做法會讓每次載入都重抓 25 個檔,
     而且離線時得靠 SW 的 ignoreSearch 才對得上快取,多一層不必要的相依。
     新增一個圖 = 在 js/graphs/ 加一個檔案,再把檔名加進下面 files 陣列(順序 = 右側按鈕順序),
     同時要加進 sw.js 的 SHELL,並把 VERSION +1。 -->
<script>
(function(){
  var files = [
    // 共用 library(要在各圖之前)
    'js/theme.js', 'js/num.js', 'js/plot.js', 'js/ui.js', 'js/expr.js', 'js/registry.js',
    // 各圖模組
    'js/graphs/line.js', 'js/graphs/quadratic.js', 'js/graphs/parabola.js', 'js/graphs/inverse.js', 'js/graphs/abs.js',
    'js/graphs/circle.js', 'js/graphs/ellipse.js', 'js/graphs/system.js', 'js/graphs/roots.js', 'js/graphs/pythagoras.js',
    'js/graphs/sine.js', 'js/graphs/tan.js', 'js/graphs/catenary.js', 'js/graphs/cycloid.js', 'js/graphs/spiral.js', 'js/graphs/cardioid.js',
    'js/graphs/astroid.js', 'js/graphs/lemniscate.js', 'js/graphs/lissajous.js'
  ];
  var last;
  files.forEach(function(src){
    var s = document.createElement('script');
    s.src = src;
    s.async = false;                 // 動態插入的 script:設 async=false 保留執行順序
    document.head.appendChild(s);
    last = s;
  });
  last.onload = function(){ if (window.App && App.init) App.init(); };  // 全部載入後才掛載 App

  // ── 離線支援 ──
  // sw.js 會預快取整個 app(27 個檔),第二次起沒網路也能用。
  // 這裡不只註冊完就算了:註冊成功不等於快取收齊 —— cache.addAll() 是全有全無,
  // 手機網路斷一下就整批失敗,而且失敗完全沒有跡象,你只會在離線時才發現進不去。
  // 所以裝完之後由頁面自己核對「我需要的檔案是不是都在快取裡」,沒收齊就講出來。
  if ('serviceWorker' in navigator && window.caches) {
    // 上一次失敗的紀錄(sw.js 寫在 curvelab-diag 裡)。這是主要管道:
    // 它是持久的,不像 postMessage 會因為頁面是舊版沒掛監聽而漏接。
    showPreviousFailure();

    navigator.serviceWorker.addEventListener('message', function(ev){
      if (ev.data && ev.data.type === 'precache-failed') offlineNote(ev.data.detail);
    });

    // 等頁面載完才註冊。原本是立刻註冊,結果 SW 的 27 個預快取請求跟這一頁自己的
    // 25 支 script 撞在一起搶頻寬 —— Firefox 對單一主機的並發連線約 6 條,
    // 兩邊加起來近 50 個請求排隊,很容易有某一個逾時(實測就有使用者卡在單一檔案
    // NetworkError)。延到 load 之後,預快取獨佔連線,而且不會拖慢首次開啟。
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('sw.js')
        .then(function(){ return readyOrTimeout(20000); })
        .then(function(){ return verifyOfflineReady(); })
        .catch(function(err){ offlineNote(err && err.message ? err.message : String(err)); });
    });
  }

  function showPreviousFailure() {
    caches.open('curvelab-diag')
      .then(function(c){ return c.match('diag'); })
      .then(function(res){ return res ? res.text() : null; })
      .then(function(txt){ if (txt) offlineNote(txt); })
      .catch(function(){ /* 沒有紀錄就是好事 */ });
  }

  // 陷阱:預快取失敗時 SW 不會啟用,而 navigator.serviceWorker.ready 在「沒有 active SW」
  // 的情況下是永遠不 resolve 的 —— 只 await 它的話,最常見的失敗情境反而什麼都不會顯示。
  // 所以加逾時,讓它變成一個會講話的錯誤。
  function readyOrTimeout(ms) {
    return Promise.race([
      navigator.serviceWorker.ready,
      new Promise(function(_, reject){
        setTimeout(function(){ reject(new Error('離線功能安裝沒有完成(可能是網路不穩)')); }, ms);
      })
    ]);
  }

  // 頁面本來就知道自己需要哪些檔(就是上面的 files),直接拿去問快取。
  function verifyOfflineReady() {
    var need = ['index.html'].concat(files);
    return Promise.all(need.map(function(p){
      return caches.match(p).then(function(hit){ return hit ? null : p; });
    })).then(function(res){
      var missing = res.filter(Boolean);
      if (missing.length) {
        throw new Error('離線功能還沒就緒:' + missing.length + '/' + need.length +
                        ' 個檔案沒進快取(例如 ' + missing[0] + ')');
      }
    });
  }

  // 同一次載入可能有兩個來源回報(SW 的 message 與 register 的 rejection),
  // 只留一條,而且以先到的(來自 SW、比較具體的那個)為準。
  function offlineNote(msg) {
    if (document.querySelector('.offline-note')) return;
    var d = document.createElement('div');
    d.className = 'offline-note';
    d.textContent = '⚠ ' + msg + '。下次有網路時重新整理即可。';
    d.title = '點一下關閉';
    d.onclick = function(){ d.remove(); };
    document.querySelector('.app__head').appendChild(d);
  }
})();
</script>
</body>
</html>
