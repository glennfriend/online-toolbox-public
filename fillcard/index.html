<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="挑一個設計好的版型,填上文字,即時產生排版精美的圖。">
  <title>Fillcard</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🗂️%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Gochi+Hand&family=Kaushan+Script&family=Permanent+Marker&family=Poppins:wght@600;700;800&family=Noto+Sans+TC:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <span class="brand">Fillcard
      <span class="info"><span class="info-btn" tabindex="0" aria-label="說明">💡</span>
        <span class="info-tip">
          <span class="tip-h">[怎麼用]</span>
          <span>選一個版型 → 左邊填 JSON 文字 → 右邊即時出圖</span>
          <span>版型已定好字型/字色/底色/間距,填字就對齊</span>
          <span>下載 SVG / PNG(2x)</span>
          <span class="tip-h">[技術]</span>
          <span>純前端;字型 Noto Sans TC(Google Fonts)</span>
          <span>PNG 匯出的中文以系統字型 fallback</span>
        </span>
      </span>
    </span>
    <button id="saveCard" class="btn btn-save" title="把目前內容存成一張新圖">＋ 儲存</button>
    <div id="cards" class="cards" title="已儲存的圖(點一下載入,× 刪除)"></div>
    <select id="templates" class="btn" title="選版型"></select>
    <select id="download" class="btn" title="下載">
      <option value="">Download</option>
      <option value="svg">SVG</option>
      <option value="png">PNG</option>
    </select>
  </header>

  <main class="workspace">
    <section class="pane">
      <div class="pane-head">JSON data</div>
      <pre id="err" class="err" hidden></pre>
      <textarea id="input" spellcheck="false"></textarea>
    </section>
    <div id="splitter" title="拖曳調整寬度(會記住)"></div>
    <section class="pane">
      <div class="pane-head">Preview</div>
      <div id="preview" class="preview"></div>
    </section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
