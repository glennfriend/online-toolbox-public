<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="自己的生活資訊手冊:搜尋或點 tag,快速找到記錄過的答案。">
  <title>Handbook</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E📔%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- 筆數疊在搜尋框右側當背景(輸入的字會蓋過去),不另外佔一列 -->
  <div class="q-wrap">
    <input id="q" type="search" placeholder="搜尋(空白分隔 = 同時符合)" autocomplete="off">
    <span id="status" class="q-count"></span>
  </div>
  <!-- tag 按鈕,後面接「記住的搜尋」(同一列,沒有記住的就不佔空間) -->
  <div id="tags"></div>
  <div id="list"></div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
